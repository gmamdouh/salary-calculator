          americanName: item.americanName, department: item.department }; });
        renderDraft(run);
        if (run.state === 'APPROVED' && !run.retryableApproval) renderApprovalSummary('Payroll approved.');
        goTo(run.retryableApproval || run.state === 'APPROVED' ? 'approve' : 'draft');
        setStatus('Run ' + run.runId + ' loaded.');
      }).catch(function (error) { showError(error.message || error); setStatus(''); });
    });
    invokeServer('getRunState').then(function (run) {
      if (run && run.valid && run.runId) {
        byId('resumeRunId').value = run.runId;
        setStatus('Saved run ' + run.runId + ' is available to resume.');
      }
    }).catch(function () {});
    byId('validateRun').addEventListener('click', function () {
      if (draftGate.isFrozen()) { showError('This run is frozen. Retry its approval from the Approve step.'); return; }
      clearError(); setStatus('Validating sources…');
      var request = { payrollMonth: byId('payrollMonth').value, cutoffMode: byId('cutoffMode').value, departmentScope: [byId('department').value] };
      invokeServer('validateRun', request).then(function (result) {
        if (!result) { showError('Validation returned no report.'); setStatus(''); return; }
        state.validation = result || {}; state.employees = result.employees || state.employees;
        state.draft = null; draftGate.load(null); byId('calculateDraft').disabled = false;
        state.blockingErrors = result.errors || result.blockingErrors || [];
        partialRunNotice.setReport(result);
        renderOmissionNotice();
        renderHolidays();
        renderEligibilityDecisions(result.decisionRequirements || []);
        byId('validationSummary').textContent = state.blockingErrors.length ? 'Blocking validation errors: ' + state.blockingErrors.length :
          (partialRunNotice.isRequired() ? 'Review every omitted department and employee below.' : 'Sources validated.');
        if (state.blockingErrors.length) showError(state.blockingErrors);
        else if (!partialRunNotice.isRequired()) { renderEmployees(); goTo('decisions'); }
        setStatus('');
      }).catch(function (error) { showError(error.message || error); setStatus(''); });
    });
    byId('partialDepartmentAck').addEventListener('change', function () {
      partialRunNotice.setAcknowledged(byId('partialDepartmentAck').checked);
      byId('continuePartialRun').disabled = !partialRunNotice.canContinue();
      refreshApproval();
    });
    byId('continuePartialRun').addEventListener('click', function () {
      if (!partialRunNotice.canContinue()) { showError('Review and acknowledge the omitted departments before continuing.'); return; }
      renderEmployees(); goTo('decisions');
    });
    byId('employeeSearch').addEventListener('input', renderEmployees);
    byId('selectAllSurvey').addEventListener('click', function () { selectDepartment('SURVEY'); });
    byId('selectAllReservations').addEventListener('click', function () { selectDepartment('RESERVATIONS'); });
    byId('matchPastedNames').addEventListener('click', function () {
      if (!holidayDecisions.active()) { showError('Choose a holiday date before matching names.'); return; }
      clearError(); invokeServer('matchHolidayNames', { text: byId('pastedNames').value,
        runId: state.validation && state.validation.runId }).then(function (report) {
        if (!report || report.valid === false) { showError(report && report.errors || 'Name matching failed.'); recordFailedAttempt(); return; }
        if (report && report.evidenceId) state.evidenceIds.push(report.evidenceId);
        showMatches(report, report && report.evidenceId);
      })
        .catch(function (error) { showError(error.message || error); recordFailedAttempt(); });
    });
    byId('uploadScreenshot').addEventListener('click', function () {
      if (!holidayDecisions.active()) { showError('Choose a holiday date before uploading a screenshot.'); return; }
      clearError(); var file = byId('holidayScreenshot').files[0];
      if (!file) { showError('Choose a screenshot first.'); return; }
      setStatus('Storing original screenshot and running OCR…');
      var reader = new FileReader(); reader.onload = function () {
        invokeServer('processHolidayScreenshot', { runId: state.validation && state.validation.runId,
          imageData: reader.result, fileName: file.name, contentType: file.type }).then(function (result) {
          if (!result) { showError('Screenshot processing failed.'); recordFailedAttempt(); setStatus(''); return; }
          if (result.evidence && result.evidence.evidenceId) state.evidenceIds.push(result.evidence.evidenceId);
          if (result.auditEvidence && result.auditEvidence.evidenceId) state.evidenceIds.push(result.auditEvidence.evidenceId);
          if (result.valid === false) showError(result.errors || 'Screenshot OCR failed.');
          showMatches(result.matchReport, result.evidence && result.evidence.evidenceId); setStatus('');
        }).catch(function (error) { showError(error.message || error); recordFailedAttempt(); setStatus(''); });
      }; reader.onerror = function () { showError('The screenshot could not be read.'); recordFailedAttempt(); };
      reader.readAsDataURL(file);
    });
    byId('matchResults').addEventListener('click', function (event) {
      var confirm = event.target.closest('[data-confirm-attempt]');
      if (confirm) {
        addConfirmedIds(ocrAttempts.confirmMatches(confirm.dataset.confirmAttempt));
        renderEmployees(); renderMatchAttempts(); return;
      }
      var resolve = event.target.closest('[data-resolve-attempt]');
      if (resolve) {
        var ids = ocrAttempts.resolveManual(resolve.dataset.resolveAttempt, Number(resolve.dataset.issueIndex), selectedIds());
        if (!ids.length) { showError('Select American names before resolving this attempt.'); return; }
        addConfirmedIds(ids); renderEmployees(); renderMatchAttempts();
      }
    });
    byId('saveDecisions').addEventListener('click', function () {
      if (draftGate.isFrozen()) { showError('This run is frozen. Retry its approval from the Approve step.'); return; }
      if (state.unresolvedDecisions || state.blockingErrors.length) { showError('Resolve blocking validation and OCR issues before continuing.'); return; }
      if (!partialRunNotice.canContinue()) { showError('Review and acknowledge the omitted departments before continuing.'); return; }
      state.decisions = decisionPayload(); goTo('draft');
    });
    byId('calculateDraft').addEventListener('click', function () {
      if (draftGate.isFrozen()) { showError('This run is frozen. Retry approval from the Approve step.'); return; }
      if (state.draft) { showError('This draft already exists. Save edits or approve the saved run.'); return; }
      clearError(); var request = { payrollMonth: byId('payrollMonth').value, cutoffMode: byId('cutoffMode').value,
        departmentScope: [byId('department').value], runId: state.validation && state.validation.runId, decisions: state.decisions,
        acknowledgements: partialRunNotice.acknowledgements() };
      invokeServer('calculateDraft', request).then(renderDraft).catch(function (error) { draftGate.load(null); showError(error.message || error); refreshApproval(); });
    });
    byId('saveDraftEdits').addEventListener('click', function () {
      if (!state.draft || !draftGate.canEdit()) { showError('An editable draft is required.'); return; }
      clearError(); var changed = Array.prototype.filter.call(document.querySelectorAll('[data-amount]'), function (input) {
        var reason = byId(input.dataset.reasonId);
        return Number(input.value) !== Number(input.dataset.persisted) || reason.value.trim() !== reason.dataset.persistedReason;
      });
      if (changed.some(function (input) { return !byId(input.dataset.reasonId).value.trim(); })) { showError('Enter a reason for every changed amount.'); return; }
      var desiredChanges = changed.map(function (input) { var row = input.closest('.draft-row'); return {
        employeeId: row.dataset.employeeId, component: row.dataset.component, value: input.value,
        reason: byId(input.dataset.reasonId).value.trim() }; });
      draftGate.beginSave(); refreshApproval();
      var chain = Promise.resolve();
      changed.forEach(function (input) { chain = chain.then(function () {
        var row = input.closest('.draft-row');
        return invokeServer('saveOverride', { runId: state.draft.runId, employeeId: row.dataset.employeeId,
          component: row.dataset.component, value: Number(input.value), reason: byId(input.dataset.reasonId).value.trim() }).then(function (result) {
            if (!result || result.valid === false) throw result && result.errors || new Error('Override could not be saved.');
          });
      }); });
      chain.then(function () { return invokeServer('getRunState', { runId: state.draft.runId }); })
        .then(function (saved) {
          if (!saved || saved.valid === false) throw saved && saved.errors || new Error('Saved draft could not be reloaded.');
          renderDraft(saved); goTo('approve');
        }).catch(function (error) {
          return invokeServer('getRunState', { runId: state.draft.runId }).then(function (saved) {
            if (!saved || saved.valid === false) {
              draftGate.saveFailed(); setStatus('Saved values could not be verified. Resume this run before editing.'); return;
            }
            renderDraft(saved);
            if (!PayrollSidebarCanRestoreEdits(saved)) {
              goTo('approve');
              if (saved.retryableApproval) renderApprovalSummary('Pending edits were discarded because approval froze this run. Retry approval of the saved frozen values.');
              return;
            }
            goTo('draft');
            desiredChanges.forEach(function (change) {
              document.querySelectorAll('.draft-row').forEach(function (row) {
                if (row.dataset.employeeId !== change.employeeId || row.dataset.component !== change.component) return;
                row.querySelector('[data-amount]').value = change.value;
                row.querySelector('[data-reason]').value = change.reason;
              });
            });
            draftGate.markDirty();
          }).catch(function () {
            draftGate.saveFailed(); setStatus('Saved values could not be verified. Resume this run before editing.');
          }).then(function () {
            showError(error.message || error); refreshApproval();
          });
        })
        .finally(function () {
          refreshApproval();
        });
    });
    function submitApproval(retry) {
      if (retry ? !draftGate.canRetry() : !canApprove()) {
        showError('Resolve blocking errors and save all draft edits before approval.'); return;
      }
      clearError(); draftGate.beginApproval(); refreshApproval();
      var runId = draftGate.runId();
      invokeServer('approveRun', runId).then(function (result) {
        if (result && result.valid === true && result.state === 'APPROVED') {
          draftGate.approvalSucceeded(); renderApprovalSummary('Payroll approved.'); refreshApproval(); return;
        }
        return invokeServer('getRunState', { runId: runId }).catch(function () { return null; }).then(function (saved) {
          var retryable = PayrollSidebarApprovalRetryable(result, saved);
          if (saved && saved.valid && retryable) renderDraft(saved);
          draftGate.approvalFailed(retryable);
          state.blockingErrors = result && (result.blockingErrors || result.errors) || [{ message: 'Approval failed.' }];
          showError(state.blockingErrors);
          renderApprovalSummary(retryable ? 'Approval stopped during a recoverable write. Retry approval of the saved frozen values.' :
            'Approval is blocked. Review the reported input errors.');
          refreshApproval();
        });
      }).catch(function (error) {
        invokeServer('getRunState', { runId: runId }).then(function (saved) {
          var retryable = !!(saved && saved.valid && saved.retryableApproval);
          if (saved && saved.valid && retryable) renderDraft(saved);
          draftGate.approvalFailed(retryable);
          showError(error.message || error);
          renderApprovalSummary(retryable ? 'Approval stopped during a recoverable write. Retry approval of the saved frozen values.' : 'Approval failed.');
          refreshApproval();
        }).catch(function () { draftGate.approvalFailed(false); showError(error.message || error); refreshApproval(); });
      });
    }
    byId('approveRun').addEventListener('click', function () { submitApproval(false); });
    byId('retryApproval').addEventListener('click', function () { submitApproval(true); });
    document.querySelectorAll('[data-step]').forEach(function (button) { button.addEventListener('click', function () { goTo(button.dataset.step); }); });
  })();
</script>
