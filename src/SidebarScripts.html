<script>
  var PayrollSidebarOcrAttemptTracker = (function () {
    function create() {
      var attempts = [], nextId = 0;
      function find(attemptId) { return attempts.find(function (attempt) { return attempt.id === attemptId; }); }
      function snapshot(attempt) {
        return { id: attempt.id, evidenceId: attempt.evidenceId, matches: attempt.matches.map(function (match) {
          return { americanName: match.americanName, employeeId: match.employeeId, confirmed: match.confirmed };
        }), manualIssues: attempt.manualIssues.map(function (issue) { return { kind: issue.kind,
          candidates: issue.candidates, resolved: issue.resolved, employeeIds: (issue.employeeIds || []).slice() }; }), warnings: attempt.warnings };
      }
      return {
        add: function (report, evidenceId) {
          report = report || {};
          var attempt = { id: 'ocr-' + (++nextId), evidenceId: evidenceId || null,
            matches: (report.matches || []).map(function (match) { return { americanName: match.americanName,
              employeeId: match.employeeId, confirmed: match.confirmed === true || match.status === 'CONFIRMED' }; }),
            manualIssues: (report.ambiguous || []).map(function (entry) { return { kind: 'AMBIGUOUS', candidates: entry.candidates || [], resolved: false }; })
              .concat((report.unmatched || []).map(function () { return { kind: 'UNMATCHED', candidates: [], resolved: false }; })),
            warnings: report.warnings || [] };
          attempts.push(attempt);
          return attempt.id;
        },
        attempts: function () { return attempts.map(snapshot); },
        confirmMatches: function (attemptId) {
          var attempt = find(attemptId); if (!attempt) return [];
          var ids = [];
          attempt.matches.forEach(function (match) {
            if (!match.confirmed) { match.confirmed = true; ids.push(match.employeeId); }
          });
          return ids;
        },
        resolveManual: function (attemptId, issueIndex, selectedEmployeeIds) {
          var attempt = find(attemptId), issue = attempt && attempt.manualIssues[issueIndex], ids = (selectedEmployeeIds || []).map(String);
          if (!issue || issue.resolved || !ids.length) return [];
          issue.resolved = true;
          issue.employeeIds = ids.slice();
          return ids;
        },
        unresolvedCount: function () {
          return attempts.reduce(function (total, attempt) {
            return total + attempt.manualIssues.filter(function (issue) { return !issue.resolved; }).length +
              attempt.matches.filter(function (match) { return !match.confirmed; }).length;
          }, 0);
        }
      };
    }
    return { create: create };
  })();
  var PayrollSidebarPartialRunNotice = (function () {
    function create() {
      var failedDepartments = [], departmentErrors = [], fingerprint = null, acknowledgedFingerprint = null;
      function detailsFor(department) {
        return departmentErrors.filter(function (item) { return item.department === department; })
          .map(function (item) { return item.message || item.code || 'Department validation failed'; });
      }
      return {
        setReport: function (report) {
          report = report || {};
          failedDepartments = (report.failedDepartments || []).slice();
          departmentErrors = (report.departmentErrors || []).slice();
          fingerprint = report.partialDepartmentsFingerprint || null;
          acknowledgedFingerprint = null;
        },
        message: function () {
          var details = failedDepartments.map(function (department) {
            var reasons = detailsFor(department);
            return department + ' omitted — ' + (reasons.length ? reasons.join('; ') : 'Department validation failed') + '.';
          }).join('\n');
          return details ? 'Partial payroll: ' + details : '';
        },
        isRequired: function () { return failedDepartments.length > 0; },
        setAcknowledged: function (value) { acknowledgedFingerprint = value === true ? fingerprint : null; },
        canContinue: function () { return !failedDepartments.length || !!fingerprint && acknowledgedFingerprint === fingerprint; },
        acknowledgements: function () { return { partialDepartmentsFingerprint: acknowledgedFingerprint }; }
      };
    }
    return { create: create };
  })();
</script>
<script>
  (function () {
    var ocrAttempts = PayrollSidebarOcrAttemptTracker.create();
    var partialRunNotice = PayrollSidebarPartialRunNotice.create();
    var state = { setup: null, validation: null, employees: [], selected: {}, employeeDecisions: {},
      confirmedOcrIds: [], evidenceIds: [], decisions: null, draft: null, blockingErrors: [], unresolvedDecisions: 0,
      validationUnresolvedCount: 0 };
    var byId = function (id) { return document.getElementById(id); };
    function showError(message) {
      var box = byId('errors'); box.hidden = false;
      box.textContent = Array.isArray(message) ? message.map(function (item) { return item.message || item.code || String(item); }).join('\n') : String(message);
    }
    function clearError() { var box = byId('errors'); box.hidden = true; box.textContent = ''; }
    function setStatus(message) { byId('status').textContent = message || ''; }
    function renderHolidays() {
      var selector = byId('holidayId'), month = byId('payrollMonth').value;
      selector.textContent = '';
      var empty = document.createElement('option'); empty.value = ''; empty.textContent = 'Choose a holiday when one applies'; selector.appendChild(empty);
      (state.setup && state.setup.holidays || []).filter(function (holiday) {
        return (holiday.actualHolidayDates || []).some(function (date) { return date.slice(0, 7) === month; });
      }).forEach(function (holiday) {
        var option = document.createElement('option'); option.value = holiday.holidayId;
        option.textContent = holiday.name + ' · ' + holiday.actualHolidayDates.join(', ');
        selector.appendChild(option);
      });
    }
    function invokeServer(name, value) {
      return new Promise(function (resolve, reject) {
        var runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(function (error) { reject(error); });
        if (name === 'getRunSetup') runner.getRunSetup();
        else if (name === 'validateRun') runner.validateRun(value);
        else if (name === 'calculateDraft') runner.calculateDraft(value);
        else if (name === 'saveOverride') runner.saveOverride(value);
        else if (name === 'approveRun') runner.approveRun(value);
        // These narrow server bridges call OcrService; image storage completes before Vision OCR.
        else if (name === 'processHolidayScreenshot') runner.processHolidayScreenshot(value);
        else if (name === 'matchHolidayNames') runner.matchHolidayNames(value);
        else reject(new Error('Unknown payroll action'));
      });
    }
    function goTo(name) {
      document.querySelectorAll('[data-step]').forEach(function (item) { item.classList.toggle('active', item.dataset.step === name); });
      document.querySelectorAll('[data-panel]').forEach(function (item) { item.hidden = item.dataset.panel !== name; item.classList.toggle('active', item.dataset.panel === name); });
    }
    function renderEmployees() {
      var search = byId('employeeSearch').value.trim().toLowerCase(), container = byId('employeeList'); container.textContent = '';
      state.employees.filter(function (employee) { return !search || employee.americanName.toLowerCase().indexOf(search) !== -1; }).forEach(function (employee) {
        var label = document.createElement('label'); label.className = 'employee-option';
        var checkbox = document.createElement('input'); checkbox.type = 'checkbox'; checkbox.checked = !!state.selected[employee.employeeId];
        checkbox.addEventListener('change', function () { state.selected[employee.employeeId] = checkbox.checked; refreshApproval(); updateManualResolveButtons(); });
        label.appendChild(checkbox); label.appendChild(document.createTextNode(employee.americanName + ' · ' + employee.department)); container.appendChild(label);
      });
    }
    function selectDepartment(department) {
      state.employees.filter(function (employee) { return employee.department === department; }).forEach(function (employee) { state.selected[employee.employeeId] = true; });
      renderEmployees(); updateManualResolveButtons();
    }
    function renderEligibilityDecisions(requirements) {
      var container = byId('eligibilityDecisions'); container.textContent = '';
      state.employeeDecisions = {};
      (requirements || []).forEach(function (requirement) {
        var row = document.createElement('label'), select = document.createElement('select');
        row.appendChild(document.createTextNode(requirement.americanName + ' · Probation payment (' + requirement.candidateDate + ') '));
        [['', 'Choose'], ['APPROVED', 'Approve'], ['DECLINED', 'Decline']].forEach(function (item) {
          var option = document.createElement('option'); option.value = item[0]; option.textContent = item[1]; select.appendChild(option);
        });
        select.addEventListener('change', function () {
          if (select.value === 'APPROVED' || select.value === 'DECLINED') {
            state.employeeDecisions[requirement.employeeId] = { probation: { approved: select.value === 'APPROVED' } };
          } else delete state.employeeDecisions[requirement.employeeId];
          state.validationUnresolvedCount = (requirements || []).filter(function (item) { return !state.employeeDecisions[item.employeeId]; }).length;
          updateUnresolved();
        });
        row.appendChild(select); container.appendChild(row);
      });
      state.validationUnresolvedCount = (requirements || []).length;
      updateUnresolved();
    }
    function showMatches(report, evidenceId) {
      report = report || {};
      if (!(report.matches || []).length && !(report.ambiguous || []).length && !(report.unmatched || []).length) {
        report.unmatched = [{ status: 'UNMATCHED' }];
      }
      ocrAttempts.add(report, evidenceId);
      renderMatchAttempts();
    }
    function appendRow(container, text) {
      var row = document.createElement('div'); row.className = 'match-row'; row.textContent = text; container.appendChild(row);
    }
    function renderMatchAttempts() {
      var container = byId('matchResults'); container.textContent = '';
      ocrAttempts.attempts().forEach(function (attempt, index) {
        var card = document.createElement('div'); card.className = 'ocr-attempt'; card.dataset.attemptId = attempt.id;
        appendRow(card, (attempt.evidenceId ? 'Screenshot' : 'Pasted names') + ' attempt ' + (index + 1));
        attempt.matches.forEach(function (match) {
          appendRow(card, match.americanName + ' · ' + (match.confirmed ? 'confirmed' : 'pending confirmation'));
        });
        attempt.manualIssues.forEach(function (issue, issueIndex) {
          appendRow(card, issue.kind === 'AMBIGUOUS' ? 'Ambiguous' + (issue.resolved ? ' (manually resolved)' : '. Choose manually') + ': ' +
            issue.candidates.map(function (candidate) { return candidate.americanName; }).join(', ') :
            'Unmatched name' + (issue.resolved ? ' (manually resolved).' : '. Resolve manually before continuing.'));
          if (!issue.resolved) {
            var resolveIssue = document.createElement('button'); resolveIssue.type = 'button';
            resolveIssue.dataset.resolveAttempt = attempt.id; resolveIssue.dataset.issueIndex = String(issueIndex);
            resolveIssue.disabled = !selectedIds().length; resolveIssue.textContent = 'Resolve this OCR entry with selected American names';
            card.appendChild(resolveIssue);
          }
        });
        attempt.warnings.forEach(function (warning) {
          appendRow(card, warning.code === 'DUPLICATE_AMERICAN_NAME' ? 'Warning: duplicate American name ' + warning.americanName : 'Warning: ' + warning.code);
        });
        if (attempt.evidenceId) appendRow(card, 'Original screenshot retained with this attempt.');
        var hasPendingMatches = attempt.matches.some(function (match) { return !match.confirmed; });
        if (hasPendingMatches) {
          var confirm = document.createElement('button'); confirm.type = 'button'; confirm.dataset.confirmAttempt = attempt.id;
          confirm.textContent = 'Confirm this attempt’s exact matches'; card.appendChild(confirm);
        }
        container.appendChild(card);
      });
      updateUnresolved(); refreshApproval();
    }
    function updateUnresolved() { state.unresolvedDecisions = state.validationUnresolvedCount + ocrAttempts.unresolvedCount(); }
    function selectedIds() { return Object.keys(state.selected).filter(function (id) { return state.selected[id]; }); }
    function updateManualResolveButtons() {
      document.querySelectorAll('[data-resolve-attempt]').forEach(function (button) { button.disabled = !selectedIds().length; });
    }
    function addConfirmedIds(ids) {
      ids.forEach(function (id) {
        state.selected[id] = true;
        if (state.confirmedOcrIds.indexOf(id) === -1) state.confirmedOcrIds.push(id);
      });
    }
    function recordFailedAttempt() { showMatches({ matches: [], ambiguous: [], unmatched: [{ status: 'ERROR' }] }); }
    function decisionPayload() {
      return { holidayWork: { holidayId: byId('holidayId').value, applies: byId('holidayApplies').checked,
        employeeIds: selectedIds(), evidenceIds: state.evidenceIds },
        employeeDecisions: state.employeeDecisions,
        ocr: { unresolvedCount: state.unresolvedDecisions, confirmedEmployeeIds: state.confirmedOcrIds,
          attempts: ocrAttempts.attempts() } };
    }
    function missingOverrideReasons() {
      return Array.prototype.some.call(document.querySelectorAll('[data-amount]'), function (input) {
        var original = Number(input.dataset.original), edited = Number(input.value);
        return !Number.isNaN(edited) && edited !== original && !byId(input.dataset.reasonId).value.trim();
      });
    }
    function canApprove() { return !state.blockingErrors.length && state.unresolvedDecisions === 0 && !missingOverrideReasons() &&
      partialRunNotice.canContinue() && !!state.draft; }
    function refreshApproval() { var button = byId('approveRun'); if (button) button.disabled = !canApprove(); }
    function renderApprovalSummary(message) {
      var summary = byId('approvalSummary');
      summary.textContent = (partialRunNotice.message() ? 'Partial payroll — omitted departments:\n' +
        partialRunNotice.message() + '\n\n' : '') + message;
      summary.style.whiteSpace = 'pre-line';
    }
    function renderDraft(result) {
      if (result && result.errors && result.errors.some(function (item) { return item.code === 'ACK_REQUIRED'; })) {
        partialRunNotice.setReport(result);
        if (Array.isArray(result.employees)) {
          state.employees = result.employees;
          var currentEmployeeIds = Object.create(null);
          state.employees.forEach(function (employee) { currentEmployeeIds[employee.employeeId] = true; });
          Object.keys(state.selected).forEach(function (employeeId) {
            if (!currentEmployeeIds[employeeId]) delete state.selected[employeeId];
          });
        }
        byId('partialDepartmentDetails').textContent = partialRunNotice.message();
        byId('partialDepartmentAckLabel').hidden = !partialRunNotice.isRequired();
        byId('partialDepartmentAck').checked = false;
        byId('continuePartialRun').hidden = !partialRunNotice.isRequired();
        byId('continuePartialRun').disabled = partialRunNotice.isRequired();
        byId('validationSummary').textContent = 'Department failures changed; review and acknowledge the updated report before continuing.';
        state.draft = null; state.blockingErrors = []; goTo('validate'); refreshApproval(); return;
      }
      state.draft = result; state.blockingErrors = result && (result.errors || result.blockingErrors) || [];
      var container = byId('draftRows'); container.textContent = '';
      if (state.blockingErrors.length) showError(state.blockingErrors);
      (result && result.results || []).forEach(function (employee) {
        Object.keys(employee.components || {}).forEach(function (component) {
          var item = employee.components[component], original = Number(item.calculatedAmount == null ? item.amount : item.calculatedAmount);
          var row = document.createElement('div'); row.className = 'draft-row'; row.dataset.employeeId = employee.employeeId; row.dataset.component = component;
          row.innerHTML = '<strong></strong><div class="draft-grid"><label>Original calculated amount <input readonly></label><label>Edited amount <input data-amount></label></div><label>Reason for change <input data-reason></label>';
          row.querySelector('strong').textContent = employee.americanName + ' · ' + component;
          var inputs = row.querySelectorAll('input'); inputs[0].value = String(original); inputs[1].value = String(item.amount);
          inputs[1].dataset.original = String(original); inputs[1].dataset.reasonId = 'reason-' + employee.employeeId + '-' + component;
          inputs[2].id = inputs[1].dataset.reasonId; inputs[1].addEventListener('input', refreshApproval); inputs[2].addEventListener('input', refreshApproval);
          container.appendChild(row);
        });
      });
      if (result && result.valid !== false) renderApprovalSummary('Draft is ready for review.');
      refreshApproval();
    }
    byId('loadSetup').addEventListener('click', function () {
      clearError(); setStatus('Loading setup…');
      invokeServer('getRunSetup').then(function (setup) {
        state.setup = setup || {}; var previous = new Date(); previous.setMonth(previous.getMonth() - 1);
        byId('payrollMonth').value = setup.payrollMonth || previous.toISOString().slice(0, 7);
        state.employees = setup.employees || []; renderHolidays(); goTo('validate'); setStatus('Setup loaded.');
      }).catch(function (error) { showError(error.message || error); setStatus(''); });
    });
    byId('payrollMonth').addEventListener('change', renderHolidays);
    byId('validateRun').addEventListener('click', function () {
      clearError(); setStatus('Validating sources…');
      var request = { payrollMonth: byId('payrollMonth').value, cutoffMode: byId('cutoffMode').value, departmentScope: [byId('department').value] };
      invokeServer('validateRun', request).then(function (result) {
        state.validation = result || {}; state.employees = result.employees || state.employees;
        state.blockingErrors = result.errors || result.blockingErrors || [];
        partialRunNotice.setReport(result);
        byId('partialDepartmentDetails').textContent = partialRunNotice.message();
        byId('partialDepartmentAckLabel').hidden = !partialRunNotice.isRequired();
        byId('partialDepartmentAck').checked = false;
        byId('continuePartialRun').hidden = !partialRunNotice.isRequired();
        byId('continuePartialRun').disabled = partialRunNotice.isRequired();
        renderEligibilityDecisions(result.decisionRequirements || []);
        byId('validationSummary').textContent = state.blockingErrors.length ? 'Blocking validation errors: ' + state.blockingErrors.length :
          (partialRunNotice.isRequired() ? 'Some departments failed; review the omitted departments below.' : 'Sources validated.');
        if (state.blockingErrors.length) showError(state.blockingErrors);
        else if (!partialRunNotice.isRequired()) { renderEmployees(); goTo('decisions'); }
        setStatus('');
      }).catch(function (error) { showError(error.message || error); setStatus(''); });
    });
    byId('partialDepartmentAck').addEventListener('change', function () {
      partialRunNotice.setAcknowledged(byId('partialDepartmentAck').checked);
      byId('continuePartialRun').disabled = !partialRunNotice.canContinue();
      refreshApproval();
    });
    byId('continuePartialRun').addEventListener('click', function () {
      if (!partialRunNotice.canContinue()) { showError('Review and acknowledge the omitted departments before continuing.'); return; }
      renderEmployees(); goTo('decisions');
    });
    byId('employeeSearch').addEventListener('input', renderEmployees);
    byId('selectAllSurvey').addEventListener('click', function () { selectDepartment('SURVEY'); });
    byId('selectAllReservations').addEventListener('click', function () { selectDepartment('RESERVATIONS'); });
    byId('matchPastedNames').addEventListener('click', function () {
      clearError(); invokeServer('matchHolidayNames', { text: byId('pastedNames').value,
        runId: state.validation && state.validation.runId }).then(function (report) {
        if (report && report.evidenceId) state.evidenceIds.push(report.evidenceId);
        showMatches(report, report && report.evidenceId);
      })
        .catch(function (error) { showError(error.message || error); recordFailedAttempt(); });
    });
    byId('uploadScreenshot').addEventListener('click', function () {
      clearError(); var file = byId('holidayScreenshot').files[0];
      if (!file) { showError('Choose a screenshot first.'); return; }
      setStatus('Storing original screenshot and running OCR…');
      var reader = new FileReader(); reader.onload = function () {
        invokeServer('processHolidayScreenshot', { runId: state.validation && state.validation.runId,
          imageData: reader.result, fileName: file.name, contentType: file.type }).then(function (result) {
          if (result.evidence && result.evidence.evidenceId) state.evidenceIds.push(result.evidence.evidenceId);
          if (result.auditEvidence && result.auditEvidence.evidenceId) state.evidenceIds.push(result.auditEvidence.evidenceId);
          showMatches(result.matchReport, result.evidence && result.evidence.evidenceId); setStatus('');
        }).catch(function (error) { showError(error.message || error); recordFailedAttempt(); setStatus(''); });
      }; reader.onerror = function () { showError('The screenshot could not be read.'); recordFailedAttempt(); };
      reader.readAsDataURL(file);
    });
    byId('matchResults').addEventListener('click', function (event) {
      var confirm = event.target.closest('[data-confirm-attempt]');
      if (confirm) {
        addConfirmedIds(ocrAttempts.confirmMatches(confirm.dataset.confirmAttempt));
        renderEmployees(); renderMatchAttempts(); return;
      }
      var resolve = event.target.closest('[data-resolve-attempt]');
      if (resolve) {
        var ids = ocrAttempts.resolveManual(resolve.dataset.resolveAttempt, Number(resolve.dataset.issueIndex), selectedIds());
        if (!ids.length) { showError('Select American names before resolving this attempt.'); return; }
        addConfirmedIds(ids); renderEmployees(); renderMatchAttempts();
      }
    });
    byId('saveDecisions').addEventListener('click', function () {
      if (state.unresolvedDecisions || state.blockingErrors.length) { showError('Resolve blocking validation and OCR issues before continuing.'); return; }
      if (!partialRunNotice.canContinue()) { showError('Review and acknowledge the omitted departments before continuing.'); return; }
      state.decisions = decisionPayload(); goTo('draft');
    });
    byId('calculateDraft').addEventListener('click', function () {
      clearError(); var request = { payrollMonth: byId('payrollMonth').value, cutoffMode: byId('cutoffMode').value,
        departmentScope: [byId('department').value], runId: state.validation && state.validation.runId, decisions: state.decisions,
        acknowledgements: partialRunNotice.acknowledgements() };
      invokeServer('calculateDraft', request).then(renderDraft).catch(function (error) { showError(error.message || error); });
    });
    byId('saveDraftEdits').addEventListener('click', function () {
      clearError(); var changed = Array.prototype.filter.call(document.querySelectorAll('[data-amount]'), function (input) { return Number(input.value) !== Number(input.dataset.original); });
      if (changed.some(function (input) { return !byId(input.dataset.reasonId).value.trim(); })) { showError('Enter a reason for every changed amount.'); return; }
      var chain = Promise.resolve();
      changed.forEach(function (input) { chain = chain.then(function () {
        var row = input.closest('.draft-row');
        return invokeServer('saveOverride', { runId: state.draft.runId, employeeId: row.dataset.employeeId,
          component: row.dataset.component, value: Number(input.value), reason: byId(input.dataset.reasonId).value.trim() });
      }); });
      chain.then(function () { goTo('approve'); renderApprovalSummary('Draft is ready for review.'); refreshApproval(); })
        .catch(function (error) { showError(error.message || error); });
    });
    byId('approveRun').addEventListener('click', function () {
      if (!canApprove()) { showError('Resolve blocking errors and missing override reasons before approval.'); return; }
      invokeServer('approveRun', state.draft.runId).then(function (result) {
        if (result && (result.valid === false || result.blockingErrors && result.blockingErrors.length)) {
          state.blockingErrors = result.blockingErrors || result.errors || [{ message: 'Approval was blocked.' }]; showError(state.blockingErrors); return;
        }
        byId('approvalSummary').textContent = 'Payroll approved.'; byId('approveRun').disabled = true;
      })
        .catch(function (error) { showError(error.message || error); });
    });
    document.querySelectorAll('[data-step]').forEach(function (button) { button.addEventListener('click', function () { goTo(button.dataset.step); }); });
  })();
</script>
